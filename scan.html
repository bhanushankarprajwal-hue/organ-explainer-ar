<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scan an AR card · Organ Explainer AR</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- AR card tracking: A-Frame + MindAR (hosted with the app) -->
  <script src="js/vendor/aframe-v1.5.0.min.js"></script>
  <script src="js/vendor/mindar-image-aframe.prod.js"></script>
  <script src="js/vendor/aframe-extras.min.js"></script>
  <script src="js/data.js"></script>
  <style>
    :root { --ink: #e8f4f2; --muted: #9fbab6; --accent: #22c3b4; --warm: #ffc457; --panel: rgba(8, 24, 32, .82); --line: rgba(34,195,180,.35); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--ink);
      font-family: "Noto Sans", "Noto Sans Kannada", "Noto Sans Tamil", system-ui, sans-serif; }
    a-scene { position: fixed; inset: 0; }
    .hud { position: fixed; z-index: 10; left: 0; right: 0; pointer-events: none;
      padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
    .hud * { pointer-events: auto; }
    .top { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 10px; }
    .chip { background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none;
      border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .9rem; backdrop-filter: blur(6px); }
    .top .title { margin-left: auto; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; max-width: 560px; margin: 0 auto; backdrop-filter: blur(8px); }
    .panel h2 { margin: 0 0 2px; font-size: 1.3rem; }
    .panel .cond { color: var(--warm); font-weight: 600; margin: 0 0 6px; }
    .panel p { margin: 0 0 10px; color: var(--muted); font-size: .92rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { display: inline-block; border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; text-decoration: none; font-size: .95rem; }
    .btn.primary { background: var(--accent); color: #04211e; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .legend { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
    .legend b { color: #6be3a0; } .legend b.sick { color: #ff8a73; }
    /* scanning frame */
    #scan-hint { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; }
    #scan-hint .frame { width: min(62vw, 340px); aspect-ratio: 10 / 13; border-radius: 18px; position: relative;
      box-shadow: 0 0 0 9999px rgba(4, 12, 18, .35); }
    #scan-hint .frame::before, #scan-hint .frame::after { content: ""; position: absolute; inset: 0; border-radius: 18px;
      border: 3px solid var(--accent); clip-path: polygon(0 0, 22% 0, 22% 4%, 4% 4%, 4% 22%, 0 22%, 0 0, 100% 0, 100% 22%, 96% 22%, 96% 4%, 78% 4%, 78% 0, 100% 0, 100% 100%, 78% 100%, 78% 96%, 96% 96%, 96% 78%, 100% 78%, 100% 100%, 0 100%, 0 78%, 4% 78%, 4% 96%, 22% 96%, 22% 100%, 0 100%); }
    #scan-hint .beam { position: absolute; left: 6%; right: 6%; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 14px var(--accent); animation: sweep 2.2s ease-in-out infinite; }
    @keyframes sweep { 0%, 100% { top: 8%; } 50% { top: 92%; } }
    @media (prefers-reduced-motion: reduce) { #scan-hint .beam { animation: none; top: 50%; } }
    #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #071018; }
    #loading .spin { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden], .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading"><div><div class="spin"></div><p id="t-loading" style="text-align:center;color:#9fbab6"></p></div></div>
  <div id="scan-hint" class="hidden"><div class="frame"><div class="beam"></div></div></div>

  <div class="hud top">
    <a class="chip" href="index.html" id="t-back">←</a>
    <a class="chip" href="cards.html" id="t-cards"></a>
    <span class="title" id="t-title"></span>
  </div>

  <div class="hud bottom">
    <div class="panel" id="idle">
      <h2 id="t-point"></h2>
      <p id="t-hint"></p>
    </div>
    <div class="panel" id="found" hidden>
      <div class="legend"><b id="t-left"></b><b class="sick" id="t-right"></b></div>
      <h2 id="f-organ"></h2>
      <p class="cond" id="f-cond"></p>
      <p id="f-short"></p>
      <div class="row">
        <a class="btn primary" id="f-story" href="#"></a>
        <a class="btn ghost" id="f-open" href="#"></a>
      </div>
    </div>
  </div>

  <a-scene id="scene"
    mindar-image="imageTargetSrc: ar/targets.mind; maxTrack: 1; uiLoading: #loading; uiScanning: #scan-hint; filterMinCF: 0.0001; filterBeta: 0.001"
    gltf-model="dracoDecoderPath: js/draco/"
    color-space="sRGB" renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets timeout="30000">
      <a-asset-item id="m-heart" src="models/heart-compare.glb"></a-asset-item>
      <a-asset-item id="m-brain" src="models/brain-compare.glb"></a-asset-item>
      <a-asset-item id="m-lungs" src="models/lungs-compare.glb"></a-asset-item>
      <a-asset-item id="m-liver" src="models/liver-compare.glb"></a-asset-item>
      <a-asset-item id="m-kidney" src="models/kidney-compare.glb"></a-asset-item>
    </a-assets>
    <a-light type="ambient" intensity="1.1"></a-light>
    <a-light type="directional" intensity="1.4" position="0.4 1 1.2"></a-light>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- one anchor per card, in the order the cards were compiled -->
    <a-entity mindar-image-target="targetIndex: 0" data-organ="heart"><a-gltf-model src="#m-heart" scale="4.3 4.3 4.3" position="0 -0.19 0.08" animation-mixer></a-gltf-model></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" data-organ="brain"><a-gltf-model src="#m-brain" scale="2.7 2.7 2.7" position="0 -0.115 0.08" animation-mixer></a-gltf-model></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" data-organ="lungs"><a-gltf-model src="#m-lungs" scale="2.5 2.5 2.5" position="0 -0.24 0.08" animation-mixer></a-gltf-model></a-entity>
    <a-entity mindar-image-target="targetIndex: 3" data-organ="liver"><a-gltf-model src="#m-liver" scale="2.1 2.1 2.1" position="0 -0.1 0.08" animation-mixer></a-gltf-model></a-entity>
    <a-entity mindar-image-target="targetIndex: 4" data-organ="kidney"><a-gltf-model src="#m-kidney" scale="6 6 6" position="0 -0.29 0.08" animation-mixer></a-gltf-model></a-entity>
  </a-scene>

  <script>
    let lang = "en";
    try { lang = localStorage.getItem("lang") || "en"; } catch (e) {}
    document.documentElement.lang = lang;
    const t = (o) => (o && o[lang] && o[lang].trim()) ? o[lang] : (o ? o.en : "");
    const $ = (id) => document.getElementById(id);
    $("t-back").textContent = "← " + t(UI_TEXT.back);
    $("t-cards").textContent = t(UI_TEXT.getCards);
    $("t-title").textContent = t(UI_TEXT.scanTitle);
    $("t-point").textContent = t(UI_TEXT.scanPoint);
    $("t-hint").textContent = t(UI_TEXT.scanHint);
    $("t-left").textContent = "◀ " + t(UI_TEXT.healthy);
    $("t-right").textContent = t(UI_TEXT.withCondition) + " ▶";
    $("t-loading").textContent = t(UI_TEXT.loadingAR);
    const byId = Object.fromEntries(CONDITIONS.map((c) => [c.id, c]));
    document.querySelectorAll("[mindar-image-target]").forEach((el) => {
      el.addEventListener("targetFound", () => {
        const c = byId[el.dataset.organ];
        $("f-organ").textContent = t(c.organ);
        $("f-cond").textContent = t(c.name);
        $("f-short").textContent = t(c.short);
        $("f-story").textContent = "▶ " + t(UI_TEXT.startStory);
        $("f-story").href = "index.html#" + c.id + "-story";
        $("f-open").textContent = t(UI_TEXT.openLesson);
        $("f-open").href = "index.html#" + c.id;
        $("idle").hidden = true; $("found").hidden = false;
      });
      el.addEventListener("targetLost", () => { $("idle").hidden = false; $("found").hidden = true; });
    });
  </script>
</body>
</html>
