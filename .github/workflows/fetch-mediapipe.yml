name: Fetch MediaPipe models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-mediapipe.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download pose + hand models (and a few test pictures)
        run: |
          mkdir -p out && cd out
          curl -fsSL -o pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
          curl -fsSL -o hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          mkdir -p test
          for u in \
            https://storage.googleapis.com/mediapipe-assets/pose.jpg \
            https://storage.googleapis.com/mediapipe-assets/pose_landmark_image.jpg \
            https://storage.googleapis.com/mediapipe-tasks/pose_landmarker/pose_landmarker_image.jpg \
            https://storage.googleapis.com/mediapipe-tasks/hand_landmarker/woman_hands.jpg \
            https://storage.googleapis.com/mediapipe-assets/hand_landmark_full_image.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Man_standing.jpg/640px-Man_standing.jpg" ; do
            curl -fsSL -o "test/$(basename "$u")" "$u" || echo "skip $u"
          done
          ls -la . test
      - name: Save on the mp-models branch
        run: |
          cd out
          git init -q -b mp-models
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "MediaPipe models"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mp-models
