<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>Body AR · Organ Explainer AR</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three/three.module.min.js", "three/addons/": "./js/vendor/three/addons/" } }
  </script>
  <script src="js/data.js"></script>
  <style>
    :root { --bg: #071018; --ink: #e6f2f0; --muted: #93aeb0; --brand: #2fd3c3; --brand-ink: #03201d; --sick: #ff7a66; --healthy: #4fd18b; --warm: #ffc457;
      --panel: rgba(7, 16, 24, .84); --line: rgba(64, 214, 199, .4); color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: "Noto Sans", "Noto Sans Kannada", "Noto Sans Tamil", system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    #cam, #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .mirror { transform: scaleX(-1); }
    .hs { position: absolute; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff;
      background: #23a866; color: #fff; font: 700 14px/26px system-ui; text-align: center; pointer-events: auto; cursor: pointer;
      box-shadow: 0 0 0 4px rgba(255,255,255,.15), 0 2px 10px rgba(0,0,0,.5); }
    .hs.sick { background: #e0533f; }
    .hs.hot { outline: 3px solid var(--warm); transform: translate(-50%, -50%) scale(1.25); }
    .tag { position: absolute; transform: translate(-50%, -120%); padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700;
      background: var(--panel); border: 1px solid var(--line); white-space: nowrap; pointer-events: auto; cursor: pointer; }
    .tag.hot { border-color: var(--warm); color: var(--warm); }
    #cursor { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid var(--brand);
      box-shadow: 0 0 14px var(--brand); pointer-events: none; display: none; }
    #cursor.pinch { background: var(--brand); }
    #cursor .ring { position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--warm); clip-path: inset(0 0 0 0); opacity: 0; }
    .hud { position: fixed; left: 0; right: 0; z-index: 10; pointer-events: none;
      padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
    .hud > * { pointer-events: auto; }
    .top { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none;
      border-radius: 999px; padding: 8px 13px; font: inherit; font-weight: 600; font-size: .88rem; cursor: pointer; backdrop-filter: blur(6px); }
    .chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: .85rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .seg button.on { background: var(--brand); color: var(--brand-ink); }
    .seg button.on.sick { background: var(--sick); color: #2a0700; }
    .bottom { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px; max-width: 600px; margin: 0 auto; backdrop-filter: blur(8px); }
    .panel h2 { margin: 0 0 2px; font-size: 1.2rem; }
    .panel .cond { margin: 0 0 6px; color: var(--warm); font-weight: 600; font-size: .92rem; }
    .panel p { margin: 0 0 8px; color: #c9dcda; font-size: .93rem; }
    .panel .small { color: var(--muted); font-size: .8rem; margin: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { display: inline-block; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: .88rem; text-decoration: none; cursor: pointer; }
    .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    #part { border-left: 3px solid var(--warm); padding-left: 10px; }
    #overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(7,16,24,.94); text-align: center; padding: 20px; }
    #overlay .spin { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(64,214,199,.25); border-top-color: var(--brand); animation: spin 1s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay p { color: var(--muted); max-width: 40ch; margin: 0 auto 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { .chip, .seg button { font-size: .8rem; padding: 7px 10px; } }
  </style>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <img id="still" alt="" hidden>
    <canvas id="gl"></canvas>
    <div id="labels"><div id="cursor"></div></div>
  </div>

  <div class="hud top">
    <a class="chip" href="index.html" id="t-back">←</a>
    <div class="seg" role="group" aria-label="State">
      <button type="button" id="st-healthy" class="on"></button>
      <button type="button" id="st-sick"></button>
    </div>
    <button type="button" class="chip on" id="hands-btn" aria-pressed="true"></button>
    <button type="button" class="chip" id="flip-btn"></button>
  </div>

  <div class="hud bottom">
    <div class="panel" id="hint">
      <h2 id="t-title"></h2>
      <p id="hint-text"></p>
      <p class="small" id="t-note"></p>
    </div>
    <div class="panel" id="info" hidden>
      <h2 id="i-organ"></h2>
      <p class="cond" id="i-cond"></p>
      <p id="i-text"></p>
      <p id="part" hidden></p>
      <div class="row">
        <button type="button" class="btn" id="i-close"></button>
        <a class="btn primary" id="i-story" href="#"></a>
        <a class="btn" id="i-open" href="#"></a>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div>
      <div class="spin" id="ov-spin"></div>
      <p id="ov-text"></p>
      <button type="button" class="btn primary" id="ov-start" hidden></button>
    </div>
  </div>

  <script type="module" src="js/body.js"></script>
</body>
</html>
