<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>Organ Explainer AR</title>
  <meta name="description" content="AR-based 3D patient education: healthy vs diseased organs, explained simply.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Models are compressed (Draco). The decoder is hosted with the app. -->
  <script>self.ModelViewerElement = { dracoDecoderLocation: new URL("js/draco/", location.href).href };</script>
  <!-- Google's 3D + AR viewer -->
  <script type="module" src="js/vendor/model-viewer.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9L12 3Zm0 2.2 6.6 3.3L12 11.8 5.4 8.5 12 5.2Zm-7 5 6 3v6.3l-6-3v-6.3Zm8 9.3v-6.3l6-3v6.3l-6 3Z" fill="currentColor"/></svg></span>
      <span data-t="appName">Organ Explainer AR</span>
    </a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" class="active">English</button>
      <button data-lang="kn">ಕನ್ನಡ</button>
      <button data-lang="ta">தமிழ்</button>
    </div>
  </header>

  <p class="disclaimer" role="note"><strong>!</strong> <span data-t="disclaimer"></span></p>

  <!-- HOME SCREEN -->
  <main id="home" class="page">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow"><span class="pulse" aria-hidden="true"></span> AR · XR in Health Care</p>
        <h1 data-t="heroTitle"></h1>
        <p class="sub" data-t="heroSub"></p>
      </div>
      <div class="modes">
        <a class="mode" href="#organs">
          <span class="mode-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17h18M6 17l2-6h8l2 6M12 11V4m-3 3 3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span><b data-t="modeTable"></b><small data-t="modeTableSub"></small></span>
        </a>
        <a class="mode" href="scan.html">
          <span class="mode-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h8v6H8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span><b data-t="modeScan"></b><small data-t="modeScanSub"></small></span>
        </a>
        <a class="mode mode-new" href="body.html">
          <span class="mode-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 9.5h10M12 9.5v5m0 0-3 6m3-6 3 6M9 9.5 7.5 14M15 9.5l1.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.5 11.5a1.5 1.5 0 0 1 3 0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
          <span><b data-t="modeBody"></b><small data-t="modeBodySub"></small></span>
        </a>
        <a class="mode mode-new" href="handar.html?c=heart">
          <span class="mode-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v6m0-4.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4 14.5a1.6 1.6 0 0 1 2.6-1.8L8 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span><b data-t="modeHand"></b><small data-t="modeHandSub"></small></span>
        </a>
        <a class="mode" href="#heart-story">
          <span class="mode-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="currentColor"/></svg></span>
          <span><b data-t="modeStory"></b><small data-t="modeStorySub"></small></span>
        </a>
      </div>
    </section>
    <h2 class="section-title" id="organs" data-t="pickOne"></h2>
    <div id="cards" class="cards"></div>
  </main>

  <!-- CONDITION SCREEN -->
  <main id="condition" class="page" hidden>
    <a class="back" href="#home">← <span data-t="back"></span></a>
    <section class="title-block">
      <div>
        <p class="organ" id="c-organ"></p>
        <h1 id="c-name"></h1>
      </div>
      <div class="title-actions">
        <a class="primary big" id="story-btn" href="#">▶ <span data-t="startStory"></span></a>
        <a class="primary big hand-btn" id="hand-btn" href="handar.html">✋ <span data-t="handAR"></span></a>
      </div>
    </section>

    <div class="view-bar">
      <div class="view-switch" role="group" aria-label="View">
        <button type="button" data-view="outside" class="active" aria-pressed="true"><span data-t="outsideView"></span></button>
        <button type="button" data-view="inside" aria-pressed="false"><span data-t="insideView"></span></button>
      </div>
      <button type="button" id="motion-btn" class="motion-btn" aria-pressed="true">⏸ <span data-t="pauseMotion"></span></button>
      <p class="view-hint" id="view-hint"></p>
    </div>

    <p class="hint" data-t="tapHint"></p>

    <section class="compare">
      <div class="side healthy">
        <figure class="viewer-card healthy">
          <figcaption><span class="dot"></span><span data-t="healthy"></span></figcaption>
          <model-viewer id="mv-healthy" autoplay camera-controls touch-action="pan-y" ar ar-modes="webxr scene-viewer quick-look"
            shadow-intensity="1" exposure="1.05" interaction-prompt="none" camera-orbit="0deg 80deg auto">
            <button slot="ar-button" class="ar-btn">⧉ <span data-t="viewAR"></span></button>
            <!-- description box shown only inside AR view -->
            <div class="ar-info healthy" id="ar-info-healthy" hidden>
              <h3 class="ar-info-title"></h3>
              <p class="ar-info-text"></p>
              <button class="ar-info-close" type="button" data-t="closeInfo"></button>
            </div>
          </model-viewer>
          <button class="reset" data-reset="mv-healthy" data-t="reset"></button>
        </figure>
        <ol class="parts" id="parts-healthy"></ol>
      </div>

      <div class="side diseased">
        <figure class="viewer-card diseased">
          <figcaption><span class="dot"></span><span data-t="withCondition"></span></figcaption>
          <model-viewer id="mv-diseased" autoplay camera-controls touch-action="pan-y" ar ar-modes="webxr scene-viewer quick-look"
            shadow-intensity="1" exposure="1.05" interaction-prompt="none" camera-orbit="0deg 80deg auto">
            <button slot="ar-button" class="ar-btn">⧉ <span data-t="viewAR"></span></button>
            <!-- description box shown only inside AR view -->
            <div class="ar-info diseased" id="ar-info-diseased" hidden>
              <h3 class="ar-info-title"></h3>
              <p class="ar-info-text"></p>
              <button class="ar-info-close" type="button" data-t="closeInfo"></button>
            </div>
          </model-viewer>
          <button class="reset" data-reset="mv-diseased" data-t="reset"></button>
        </figure>
        <ol class="parts" id="parts-diseased"></ol>
      </div>
    </section>


    <div class="both-ar">
      <button id="both-ar-btn" class="primary" hidden>⧉ <span data-t="viewBothAR"></span></button>
      <p id="no-ar" class="muted" data-t="noAR" hidden></p>
      <!-- hidden viewer used only to open both models together in AR -->
      <model-viewer id="mv-compare" loading="eager" autoplay ar ar-modes="webxr scene-viewer quick-look" class="offscreen"></model-viewer>
    </div>

    <section class="info-grid">
      <div class="about card">
        <h2 data-t="aboutOrgan"></h2>
        <p id="c-organ-about"></p>
      </div>
      <div class="about card condition">
        <h2 data-t="whatIsIt"></h2>
        <p id="c-about"></p>
      </div>
    </section>

    <section class="treatment">
      <h2 data-t="treatment"></h2>
      <ol id="c-treatment" class="steps"></ol>
    </section>

    <section class="warning card">
      <h2>⚠ <span data-t="warning"></span></h2>
      <p id="c-warning"></p>
    </section>
  </main>

  <!-- GUIDED AR STORY -->
  <section id="story" class="story" hidden aria-label="Guided AR story">
    <div class="story-top">
      <a class="chip" id="story-close" href="#home">✕ <span data-t="closeStory"></span></a>
      <span class="story-organ" id="story-organ"></span>
      <button class="chip" id="voice-btn" type="button" aria-pressed="true">🔊 <span data-t="voiceOn"></span></button>
    </div>
    <model-viewer id="mv-story" autoplay camera-controls touch-action="pan-y" ar ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1" exposure="1.1" interaction-prompt="none" camera-orbit="0deg 80deg auto" loading="eager">
      <button slot="ar-button" class="ar-btn story-ar">⧉ <span data-t="viewAR"></span></button>
      <!-- the story card stays visible inside AR -->
      <div class="story-card" id="story-card">
        <div class="story-progress"><span id="story-bar"></span></div>
        <p class="story-step"><span id="story-count"></span> · <span id="story-state"></span></p>
        <h3 id="story-title"></h3>
        <p id="story-text"></p>
        <div class="story-nav">
          <button type="button" class="ghost" id="story-prev">← <span data-t="prev"></span></button>
          <button type="button" class="primary" id="story-next"><span data-t="next"></span> →</button>
        </div>
      </div>
    </model-viewer>
    <p class="story-hint" data-t="storyHint"></p>
  </section>

  <!-- INFO SHEET (opens when a dot is tapped) -->
  <aside id="info" class="info" hidden aria-live="polite">
    <div class="info-inner">
      <span id="info-tag" class="tag"></span>
      <h3 id="info-title"></h3>
      <p id="info-text"></p>
      <button id="info-close" class="ghost" data-t="closeInfo"></button>
    </div>
  </aside>

  <div id="toast" class="toast" hidden></div>

  <footer class="foot">
    <p>XR in Health Care · Dayananda Sagar University · <span data-t="disclaimer"></span></p>
    <p class="credits"><span data-t="credits"></span>: <span id="credits"></span></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
