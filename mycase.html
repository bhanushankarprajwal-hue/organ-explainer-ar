<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060d14">
  <title>My Report · Organ Explainer AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three/three.module.min.js", "three/addons/": "./js/vendor/three/addons/" } }
  </script>
  <style>
    body { min-height: 100vh; }
    .case-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gut-r) 10px var(--gut-l); background: rgba(6, 13, 20, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .case-top h1 { font-size: 1.15rem; margin: 0; }
    .case-top .organ { margin: 0; }
    .case-top .grow { flex: 1; min-width: 0; }
    .case-top .organ-switch { margin: 0; padding: 0; display: flex !important; }
    .case-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; padding: 18px var(--gut-r) 28px var(--gut-l); max-width: 1500px; margin: 0 auto; align-items: start; }
    .stage { position: sticky; top: 80px; height: calc(100vh - 110px); min-height: 420px; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
    .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .stage .grid-floor { position: absolute; inset: auto 0 0; height: 40%; pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(47,211,195,.08) 0 1px, transparent 1px 34px), repeating-linear-gradient(0deg, rgba(47,211,195,.08) 0 1px, transparent 1px 34px);
      transform: perspective(400px) rotateX(60deg); transform-origin: bottom; mask-image: linear-gradient(transparent, #000); }
    .badge { position: absolute; top: 14px; left: 14px; z-index: 2; display: flex; align-items: center; gap: 10px; background: rgba(6,13,20,.86); border: 1px solid var(--line-2);
      border-radius: 16px; padding: 10px 14px; backdrop-filter: blur(6px); }
    .badge .big { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
    .badge small { display: block; color: var(--muted); font-size: .76rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .lvl { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: .8rem; font-weight: 800; }
    .lvl.none { background: rgba(79,209,139,.18); color: var(--healthy); }
    .lvl.mild { background: rgba(255,196,87,.16); color: var(--warm); }
    .lvl.moderate { background: rgba(255,150,80,.18); color: #ffa45c; }
    .lvl.severe { background: rgba(255,122,102,.2); color: var(--sick); }
    .stage-tools { position: absolute; top: 14px; right: 14px; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .stage-label { position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, 0); pointer-events: none; padding: 4px 12px; border-radius: 999px;
      background: rgba(6,13,20,.86); border: 1px solid var(--line); font-weight: 700; font-size: .82rem; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .stage-label.h .dot { background: var(--healthy); } .stage-label.d .dot { background: var(--sick); }
    .stage-hint { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .8rem; pointer-events: none; z-index: 2; }
    .panel-stack { display: grid; gap: 14px; }
    .panel h2 { font-size: 1.02rem; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .panel h2 .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-family: var(--mono); font-size: .78rem; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-weight: 600; font-size: .9rem; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
    .field label output { color: var(--brand); font-weight: 800; font-size: 1rem; white-space: nowrap; }
    input[type=range] { width: 100%; accent-color: var(--brand); height: 28px; }
    select { width: 100%; background: var(--bg-2); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font: inherit; }
    .means-text { color: var(--ink-2); margin: 10px 0 8px; }
    .note { color: var(--muted); font-size: .78rem; margin: 0; }
    .seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
    .seg2 button { border: 0; background: transparent; color: var(--muted); font-weight: 700; padding: 8px 10px; border-radius: 999px; font-size: .86rem; }
    .seg2 button.on.bad { background: var(--sick); color: #2a0700; }
    .seg2 button.on.good { background: var(--healthy); color: #04170f; }
    .tl-row { display: flex; align-items: center; gap: 10px; }
    .tl-row input { flex: 1; }
    .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: .72rem; font-family: var(--mono); margin: -2px 52px 0 2px; }
    .when { font-weight: 800; font-size: 1.05rem; margin: 12px 0 4px; }
    .tl-text { color: var(--ink-2); margin: 0 0 8px; min-height: 3em; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions .btn { white-space: normal; text-align: center; }
    @media (max-width: 899px) {
      .case-grid { grid-template-columns: 1fr; }
      .stage { position: relative; top: 0; height: 52vh; min-height: 320px; }
      .case-top .organ-switch { order: 3; width: 100%; }
      .stage-tools { top: auto; bottom: 40px; right: 12px; }
    }
  </style>
</head>
<body>
  <header class="case-top">
    <a class="chip" id="back" href="index.html">←</a>
    <div class="grow">
      <p class="organ" id="c-organ"></p>
      <h1 id="c-title"></h1>
    </div>
    <nav class="organ-switch" id="switch" aria-label="Organs"></nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="kn">ಕ</button><button data-lang="ta">த</button>
    </div>
  </header>

  <main class="case-grid">
    <section class="stage" id="stage" aria-label="3D view of the patient's organ">
      <div class="grid-floor"></div>
      <div class="badge"><div><small id="b-when"></small><span class="big" id="b-val"></span></div><span class="lvl" id="b-lvl"></span></div>
      <div class="stage-tools"><button type="button" class="chip" id="cmp-btn" aria-pressed="false"></button></div>
      <span class="stage-label h" id="lab-h" hidden><span class="dot"></span><span></span></span>
      <span class="stage-label d" id="lab-d" hidden><span class="dot"></span><span></span></span>
      <p class="stage-hint" id="stage-hint"></p>
    </section>

    <aside class="panel-stack">
      <p class="sub" id="c-sub" style="margin:0"></p>
      <section class="panel">
        <h2><span class="num">1</span><span id="h-details"></span></h2>
        <div id="fields"></div>
      </section>
      <section class="panel">
        <h2><span class="num">2</span><span id="h-means"></span></h2>
        <span class="lvl" id="m-lvl"></span>
        <p class="means-text" id="m-text"></p>
        <p class="note" id="m-note"></p>
      </section>
      <section class="panel">
        <h2><span class="num">3</span><span id="h-time"></span></h2>
        <div class="seg2" role="group">
          <button type="button" class="bad on" id="p-none"></button>
          <button type="button" class="good" id="p-treat"></button>
        </div>
        <div class="tl-row">
          <input type="range" id="tl" min="0" max="10" step="0.1" value="0" aria-label="Time">
          <button type="button" class="btn small" id="play"></button>
        </div>
        <div class="ticks"><span id="tk0"></span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div>
        <p class="when" id="when"></p>
        <p class="tl-text" id="tl-text"></p>
        <p class="note" id="tl-note"></p>
      </section>
      <div class="actions">
        <a class="btn primary" id="ar-btn" href="#">⧉ <span id="ar-label"></span></a>
        <a class="btn" id="quiz-btn" href="quiz.html">✓ <span id="quiz-label"></span></a>
      </div>
      <p class="note" id="edu"></p>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script type="module" src="js/mycase.js"></script>
</body>
</html>
